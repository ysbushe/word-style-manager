[project]
name = "word-style-manager"
version = "0.3.0"
description = "Word/WPS 样式清理、模板提取与模板库管理工具"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "lxml>=5.1.0",
    "ttkbootstrap>=1.10.0",
    "tkinterdnd2>=0.4.0",
    "pywin32>=306",
]

[project.scripts]
ewt = "src.ewt.ui.app:main"
